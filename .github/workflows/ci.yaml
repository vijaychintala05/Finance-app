name: FirmBooks CI - Production Qualification

on:
  push:
    branches:
      - main
      - master
      - nas-deploy
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - master
      - nas-deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint & Compilation Check
        run: npm run lint

  test-suites:
    name: PostgreSQL & Backend Regression Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: firmbooks_test
          POSTGRES_USER: firmbooks_test
          POSTGRES_PASSWORD: firmbooks_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firmbooks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated real PostgreSQL qualification
        env:
          DATABASE_URL: postgres://firmbooks_test:firmbooks_test_password@127.0.0.1:5432/firmbooks_test
          JWT_SECRET: test-ci-secret-32-chars-long-security
          AUTH_ENCRYPTION_KEY: test-encryption-key-for-ci-suite-32ch
          REQUIRE_REAL_POSTGRES: "true"
          DATABASE_MODE: postgres
          USE_PG_MEM: "false"
        run: npm run test:postgres

      - name: Run Full Vitest Regression Suite
        env:
          JWT_SECRET: test-ci-secret-32-chars-long-security
          AUTH_ENCRYPTION_KEY: test-encryption-key-for-ci-suite-32ch
          DATABASE_MODE: memory
          USE_PG_MEM: "true"
        run: npm test

  browser-qualification:
    name: Playwright Browser Qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Production Client & Server
        run: npm run build

      - name: Run Playwright Browser Regression Specs
        env:
          JWT_SECRET: test-e2e-secret-32-chars-long-security
          AUTH_ENCRYPTION_KEY: test-encryption-key-for-e2e-suite-32ch
          DATABASE_MODE: memory
          USE_PG_MEM: "true"
        run: npx playwright test

      - name: Upload E2E Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-build:
    name: Production Artifact Build Verification
    runs-on: ubuntu-latest
    needs: [static-analysis, test-suites]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
