name: Publish FirmBooks backup container

on:
  push:
    branches:
      - nas-deploy
      - main
    paths:
      - deploy/nas/backup.sh
      - deploy/nas/Dockerfile.backup
      - .github/workflows/publish-backup.yaml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vijaychintala05/finance-app

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check backup script syntax
        run: sh -n deploy/nas/backup.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backup image only
        uses: docker/build-push-action@v6
        with:
          context: deploy/nas
          file: deploy/nas/Dockerfile.backup
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:backup-latest
            ${{ env.IMAGE_NAME }}:backup-${{ github.sha }}
