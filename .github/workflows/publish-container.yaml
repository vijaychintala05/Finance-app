name: Publish FirmBooks container

on:
  push:
    branches:
      - master
      - main
      - nas-deploy
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vijaychintala05/finance-app

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build production artifacts
        run: npm run build

      - name: Run unit and integration tests
        env:
          JWT_SECRET: firmbooks-ci-jwt-secret-with-at-least-thirty-two-characters
          AUTH_ENCRYPTION_KEY: firmbooks-ci-auth-encryption-key-at-least-thirty-two-characters
          DATABASE_MODE: memory
          USE_PG_MEM: "true"
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image for smoke testing
        run: docker build --tag firmbooks-ci:${{ github.sha }} .

      - name: Smoke test container with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create firmbooks-ci
          docker run -d --name firmbooks-postgres --network firmbooks-ci \
            -e POSTGRES_DB=firmbooks \
            -e POSTGRES_USER=firmbooks \
            -e POSTGRES_PASSWORD=firmbooks-ci-password \
            postgres:16-alpine
          until docker exec firmbooks-postgres psql -U firmbooks -d firmbooks -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done
          sleep 2
          docker run -d --name firmbooks-app --network firmbooks-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://firmbooks:firmbooks-ci-password@firmbooks-postgres:5432/firmbooks \
            -e JWT_SECRET=firmbooks-ci-jwt-secret-with-at-least-thirty-two-characters \
            -e AUTH_ENCRYPTION_KEY=firmbooks-ci-auth-encryption-key-at-least-thirty-two-characters \
            -e ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000 \
            -e TRUSTED_FINANCE_FEATURES=period-close,recovery-center,bank-statement-import,bank-reconciliation,receivables-corrections,payables-settlement,recurring-transactions,fixed-assets,team-access \
            firmbooks-ci:${{ github.sha }}
          TEST_BASE_URL="http://127.0.0.1:3000" node scripts/ci-smoke-test.mjs

      - name: Show smoke-test logs on failure
        if: failure()
        run: |
          docker logs firmbooks-app || true
          docker logs firmbooks-postgres || true

      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm -f firmbooks-app firmbooks-postgres || true
          docker network rm firmbooks-ci || true

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
